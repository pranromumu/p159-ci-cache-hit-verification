name: CI Cache Hit Verification

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        id: setup-python # <--- THE MAGIC TRICK: Give the step an ID!
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Report Cache Status
        # Use the output from the setup-python step to write a dynamic summary!
        if: ${{ steps.setup-python.outputs.cache-hit == 'true' }}
        run: |
          echo "## Dependency Cache" >> $GITHUB_STEP_SUMMARY
          echo "Cache was restored successfully. ✅" >> $GITHUB_STEP_SUMMARY

      - name: Report Cache Miss
        if: ${{ steps.setup-python.outputs.cache-hit != 'true' }}
        run: |
          echo "## Dependency Cache" >> $GITHUB_STEP_SUMMARY
          echo "No previous cache was restored. ⚠️" >> $GITHUB_STEP_SUMMARY

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Pytest
        run: pytest -v -s